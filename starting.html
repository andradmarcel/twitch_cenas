<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>DEC4LAND - Live Começando</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/starting.css">
  <link rel="stylesheet" href="css/alerts.css">
  <script src="config.js"></script>
</head>

<body tabindex="0">
  <div class="scene-container" id="starting-scene">
    <!-- Twitch Alert Popup Layer -->
    <div class="alert-container"></div>

    <!-- Cyberpunk ambient background -->
    <div class="cyber-grid"></div>
    <canvas class="particles-canvas" id="particles-bg"></canvas>

    <!-- Tech Corner Brackets (from reference) -->
    <div class="tech-bracket-tl"></div>
    <div class="tech-bracket-tr">
      <div class="tech-block-tr"></div>
    </div>
    <div class="tech-bracket-bl"></div>
    <div class="tech-bracket-br"></div>

    <!-- Top Status Bar -->
    <div class="top-hud-bar">
      <div class="live-pill">
        <span class="pulse-dot"></span>
        <span>INICIANDO TRANSMISSÃO</span>
      </div>
      <div class="server-status">SERVER: BR // 1080P60 // BITRATE OK</div>
    </div>

    <!-- Main Content Grid -->
    <div class="starting-grid">
      <!-- Left Column: Branding, Title, Timer, Socials -->
      <div class="starting-left">
        <!-- Main Brand Header -->
        <div class="brand-logo-container">
          <h1 class="brand-title" data-text="DEC4LAND">DEC4LAND</h1>
          <div class="brand-subtitle">
            <span>OFFICIAL STREAM CHANNEL</span>
          </div>
        </div>

        <!-- Scene Headline -->
        <div class="starting-headline-box">
          <span class="headline-tag">// AGUARDE UM MOMENTO</span>
          <h2 class="starting-headline">LIVE COMEÇANDO</h2>
        </div>

        <!-- Dynamic Countdown Widget -->
        <div class="countdown-widget cyber-panel">
          <div class="timer-display">
            <div class="time-block">
              <span class="time-val" id="minutes">05</span>
              <span class="time-label">MIN</span>
            </div>
            <span class="time-colon">:</span>
            <div class="time-block">
              <span class="time-val" id="seconds">00</span>
              <span class="time-label">SEG</span>
            </div>
          </div>

          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="timer-progress"></div>
          </div>

          <div class="status-ticker">
            <span class="ticker-icon"></span>
            <span class="ticker-text" id="status-message">Conectando aos servidores da Twitch...</span>
          </div>
        </div>

        <!-- Social Bar (From Reference Image) -->
        <div class="social-bar">
          <!-- Twitter / X -->
          <div class="social-item">
            <div class="social-icon">
              <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                  d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.936 9.936 0 0024 4.59z" />
              </svg>
            </div>
            <span class="social-handle">@DEC4LANDOFICIAL</span>
          </div>

          <!-- Instagram -->
          <div class="social-item">
            <div class="social-icon">
              <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                  d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
              </svg>
            </div>
            <span class="social-handle">@ANDRADMARCEL</span>
          </div>

          <!-- YouTube -->
          <div class="social-item">
            <div class="social-icon">
              <svg viewBox="0 0 24 24" width="24" height="24">
                <path fill="currentColor"
                  d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
              </svg>
            </div>
            <span class="social-handle">/DEC4LAND</span>
          </div>
        </div>

        <!-- Equalizer Element (From Reference bottom-left) -->
        <div class="bottom-audio-bar">
          <div class="audio-equalizer">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
          <span class="audio-status">DEC4LAND AUDIO SYSTEM ONLINE // 48kHz</span>
        </div>
      </div>

      <!-- Right Column: Hero Mascot with Aura -->
      <div class="starting-right">
        <div class="mascot-wrapper">
          <div class="mascot-aura"></div>
          <img src="assets/mascot.webp" alt="DEC4LAND Mascote" class="mascot-image">
          <!-- Cyber decorative rings around mascot -->
          <div class="mascot-tech-ring"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/particles.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/starting.js"></script>
</body>

</html>
